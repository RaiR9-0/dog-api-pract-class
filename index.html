<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consulta de Perros - The Dog API</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="header">
    <h1>Consulta de Razas de Perros</h1>
    <p class="subtitle">Aplicacion web para consumir el servicio REST de The Dog API (api.thedogapi.com).</p>
  </header>

  <main class="main-container">
    <section class="search-panel">
      <h2>Que tipo de perro buscas?</h2>
      <div class="category-buttons" id="opciones">
        <button type="button" class="btn-category" data-filtro="pequeno">Pequeños</button>
        <button type="button" class="btn-category" data-filtro="mediano">Medianos</button>
        <button type="button" class="btn-category" data-filtro="grande">Grandes</button>
        <button type="button" class="btn-category" data-filtro="agresivo">Agresivos</button>
        <button type="button" class="btn-category" data-filtro="sumiso">Sumisos</button>
      </div>
    </section>

    <section class="results-panel">
      <div class="results-header">
        <h2>Resultados</h2>
        <span id="resultsCount" class="results-counter">Cargando razas...</span>
      </div>
      <div id="resultsGrid" class="results-grid"></div>
    </section>
  </main>

  <footer class="footer">
    <p>Practica en clase 03/10/2026</p>
    <p>Datos provistos por The Dog API.</p>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
